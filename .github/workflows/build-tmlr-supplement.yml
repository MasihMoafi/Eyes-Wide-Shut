name: Build anonymous TMLR supplement

on:
  push:
    branches:
      - publication/tmlr-submission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble supplement
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/tmlr_anonymous_supplement"
          mkdir -p "$OUT/study1" "$OUT/study2" "$OUT/study3" "$OUT/environment" "$OUT/analysis"

          # Copy the complete experiment records used by the three-study paper.
          cp -a experiments/finding1/. "$OUT/study1/"
          cp -a experiments/finding2/. "$OUT/study2/"
          cp -a experiments/finding3/. "$OUT/study3/"

          # Preserve the three submitted full traces under anonymous filenames.
          for i in 1 2 3; do
            if [ -f "submission-files/masih_finding_${i}.json" ]; then
              cp "submission-files/masih_finding_${i}.json" "$OUT/study${i}/submitted_trace.json"
            fi
          done

          # Include the exact paper-side analysis and figure generator.
          cp paper/section_finding1.tex "$OUT/analysis/" 2>/dev/null || true
          cp paper/main.tex "$OUT/analysis/paper_source_reference.tex" 2>/dev/null || true
          find paper -maxdepth 2 -type f \( -name '*.py' -o -name '*.tex' \) -print0 | while IFS= read -r -d '' f; do
            base=$(basename "$f")
            case "$base" in
              main.tex|section_finding1.tex) ;;
              *) cp "$f" "$OUT/analysis/${base}" 2>/dev/null || true ;;
            esac
          done

          # Capture model/environment records already present in the repository.
          find . -type f \( -iname 'model_version*.json' -o -iname '*environment*.json' -o -iname '*hardware*.txt' -o -iname '*requirements*.txt' \) \
            -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
              cp "$f" "$OUT/environment/$(basename "$f")" 2>/dev/null || true
            done

          # Remove irrelevant caches, generated webpages, and binaries from the evidence archive.
          find "$OUT" -type d \( -name '__pycache__' -o -name '.ipynb_checkpoints' \) -prune -exec rm -rf {} +
          find "$OUT" -type f \( -name '*.pyc' -o -name '*.html' -o -name '*.pdf' -o -name '*.png' -o -name '*.log' \) -delete

          cat > "$OUT/README.md" <<'EOF'
          # Anonymous supplementary material

          This archive supports a three-study empirical paper on safety-relevant behavior in `gpt-oss-20b`.

          ## Contents

          - `study1/`: matched simulation-framing arms, diagnostic records, prompts, scripts, and aggregate summaries.
          - `study2/`: retained-history and condensed semantic-escalation arms, raw transcripts, labels, runner, and scoring contract.
          - `study3/`: synthetic-secret protocol, raw 30-seed transcripts, runner/arm definitions, and exact-string outcomes.
          - `analysis/`: paper-side extraction/analysis source used to construct reported figures and claims.
          - `environment/`: model or runtime metadata present in the experiment repository.
          - `MANIFEST.sha256`: SHA-256 checksum for every included file.
          - `VALIDATION_REPORT.txt`: machine-generated inventory and consistency checks.

          ## System boundary

          The Study 1 action wrapper is deliberately inert: generated structured calls are recorded, but no destructive payload is executed. Study 2 visible-output labels use the disclosed binary scoring contract. Study 3 counts only literal occurrence of the fixed synthetic string in returned fields.

          ## Reproduction

          Each study directory retains its original internal structure. Start with the README, arm-definition, runner, and scoring files within that directory. Raw JSONL records include all stored returned fields and per-trial seeds available in the repository snapshot.

          ## Scope

          The archive concerns one local `gpt-oss:20b` package and the recorded runtime configurations. It does not claim generalization to other models, package revisions, quantizations, renderers, or deployments.
          EOF

          # Remove identity-bearing strings and machine-specific paths from text artifacts.
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path(__import__('os').environ['RUNNER_TEMP']) / 'tmlr_anonymous_supplement'
          binary_ext = {'.zip', '.gz', '.jpg', '.jpeg', '.png', '.pdf', '.pyc'}
          replacements = [
              (re.compile(r'Masih\s+Moafi', re.I), 'Anonymous Author'),
              (re.compile(r'MasihMoafi', re.I), 'AnonymousAuthor'),
              (re.compile(r'masihmoafi\.com', re.I), 'anonymous.invalid'),
              (re.compile(r'm\.moafi@el\.iut\.ac\.ir', re.I), 'anonymous@invalid.example'),
              (re.compile(r'masihmoafi12@gmail\.com', re.I), 'anonymous@invalid.example'),
              (re.compile(r'https?://github\.com/MasihMoafi/Eyes-Wide-Shut/?', re.I), 'ANONYMIZED_REPOSITORY'),
              (re.compile(r'/home/[^/\s]+/'), '/home/anonymous/'),
              (re.compile(r'/Users/[^/\s]+/'), '/Users/anonymous/'),
          ]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() in binary_ext:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for pattern, replacement in replacements:
                  text = pattern.sub(replacement, text)
              p.write_text(text, encoding='utf-8')
          PY

          # Generate an evidence inventory and lightweight consistency checks.
          OUT="$OUT" python - <<'PY'
          from pathlib import Path
          import json, os, re

          root = Path(os.environ['OUT'])
          lines = []
          lines.append('ANONYMOUS TMLR SUPPLEMENT VALIDATION REPORT')
          lines.append('')
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  rel = p.relative_to(root)
                  lines.append(f'{rel}\t{p.stat().st_size} bytes')
                  if p.suffix == '.jsonl':
                      n = sum(1 for line in p.open(encoding='utf-8', errors='replace') if line.strip())
                      lines.append(f'  nonempty JSONL records: {n}')

          # Exact checks for known reported Study 3 fields when the raw baseline is present.
          candidates = list((root / 'study3').rglob('finding3_reproducible_baseline.jsonl'))
          if candidates:
              records = [json.loads(x) for x in candidates[0].read_text(encoding='utf-8').splitlines() if x.strip()]
              lines += ['', 'Study 3 exact checks:', f'  records: {len(records)}',
                        f"  leak_in_thinking=true: {sum(bool(r.get('leak_in_thinking')) for r in records)}",
                        f"  leak_in_final=true: {sum(bool(r.get('leak_in_final')) for r in records)}"]

          # Aggregate Study 2 labels without assuming a fixed schema.
          label_files = list((root / 'study2').rglob('classifications_legacy.json'))
          if label_files:
              obj = json.loads(label_files[0].read_text(encoding='utf-8'))
              flat = json.dumps(obj).lower()
              lines += ['', 'Study 2 label-file presence:', f'  file: {label_files[0].relative_to(root)}',
                        f"  occurrences of 'compli': {flat.count('compli')}",
                        f"  occurrences of 'refus': {flat.count('refus')}"]

          (root / 'VALIDATION_REPORT.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          # Fail the build if direct identifiers, credentials, or absolute personal paths remain.
          if grep -RIE --binary-files=without-match \
            'Masih[[:space:]]+Moafi|MasihMoafi|masihmoafi\.com|m\.moafi@|masihmoafi12@|github\.com/MasihMoafi|/home/[^/[:space:]]+/|/Users/[^/[:space:]]+/' "$OUT"; then
            echo 'Anonymization audit failed.' >&2
            exit 1
          fi
          if grep -RIE --binary-files=without-match \
            '(api[_-]?key|token|secret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_\-]{20,}' "$OUT"; then
            echo 'Potential credential detected.' >&2
            exit 1
          fi

          (cd "$OUT" && find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          (cd "$RUNNER_TEMP" && zip -qr tmlr_anonymous_supplement.zip tmlr_anonymous_supplement)
          ls -lh "$RUNNER_TEMP/tmlr_anonymous_supplement.zip"

      - name: Upload supplement
        uses: actions/upload-artifact@v4
        with:
          name: tmlr-anonymous-supplement
          path: ${{ runner.temp }}/tmlr_anonymous_supplement.zip
          if-no-files-found: error
          retention-days: 30
